{{- if .Values.restapi.enabled.deployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "restapi.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chirpstack.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  revisionHistoryLimit: 2
  {{- if not .Values.restapi.autoscaling.enabled }}
  replicas: {{ .Values.restapi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "restapi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # checksum/config: {{ include (print $.Template.BasePath "/chirpstack-configmap.yaml") . | sha256sum }}
        # checksum/secret: {{ include (print $.Template.BasePath "/chirpstack-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "restapi.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chirpstack.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.restapi.image.repository }}:{{ .Values.restapi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.restapi.image.pullPolicy }}
          {{- with .Values.restapi.args }}                                                                                   
          args:                                                                                                                 
          {{- toYaml . | nindent 12 }}                                                                                        
          {{- end }}  
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.restapi.service.containerPort }}
              protocol: TCP
          # envFrom maps all keys from the ConfigMap and Secret
          # envFrom:
          #   {{- if .Values.restapi.enabled.configMap }}
          #   - configMapRef:
          #       name: {{ include "restapi.fullname" . }}-config
          #   {{- end }}
          #   {{- if .Values.restapi.enabled.secret }}
          #   - secretRef:
          #       name: {{ .Values.restapi.secret.name }}
          #   {{- end }}
          # volumeMounts:
          #   - name: config-volume
          #     mountPath: /etc/chirpstack
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      # volumes:
      #   - name: config-volume
      #     configMap:
      #       name: {{ include "restapi.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
