{{- if .Values.chirpstack.enabled.deployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chirpstack.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chirpstack.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  revisionHistoryLimit: 2
  {{- if not .Values.chirpstack.autoscaling.enabled }}
  replicas: {{ .Values.chirpstack.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chirpstack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/chirpstack-configmap.yaml") . | sha256sum }}
        checksum/toml: {{ include (print $.Template.BasePath "/chirpstack-toml-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/chirpstack-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "chirpstack.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chirpstack.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: "postgres:14-alpine"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.chirpstack.secret.name }}
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h {{ .Values.chirpstack.postgresql.host }} \
                -p {{ .Values.chirpstack.postgresql.port }} \
                -U {{ .Values.chirpstack.postgresql.username }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: "redis:7-alpine"
          command:
            - /bin/sh
            - -c
            - |
              until redis-cli -h {{ .Values.chirpstack.redis.host }} \
                -p {{ .Values.chirpstack.redis.port }} \
                -a {{ .Values.chirpstack.redis.password }} ping | grep -q PONG; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.chirpstack.image.repository }}:{{ .Values.chirpstack.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.chirpstack.image.pullPolicy }}
          {{- with .Values.chirpstack.command }}
          command:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.chirpstack.args }}
          args:
          {{- toYaml . | nindent 12 }}
          {{- end }}                                                                                                            
          securityContext:                                                                                                      
          {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.chirpstack.service.containerPort }}
              protocol: TCP
          # envFrom maps all keys from the ConfigMap and Secret
          envFrom:
            {{- if .Values.chirpstack.enabled.configMap }}
            - configMapRef:
                name: {{ include "chirpstack.fullname" . }}-config
            {{- end }}
            {{- if .Values.chirpstack.enabled.secret }}
            - secretRef:
                name: {{ .Values.chirpstack.secret.name }}
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/chirpstack
            {{- with .Values.secretMounts }}
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .path }}
              readOnly: true
            {{- end }}
            {{- end }}              
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-volume
          projected:
            sources:
            - configMap:
                name: {{ include "chirpstack.fullname" . }}-config
            - configMap:
                name: {{ include "chirpstack.fullname" . }}-toml-config
        - name: chirpstack-certs
          secret:
            secretName: {{ include "chirpstack.fullname" . }}-certs            
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
