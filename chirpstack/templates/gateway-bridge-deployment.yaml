{{- if .Values.gatewaybridge.enabled.deployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatewaybridge.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chirpstack.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  revisionHistoryLimit: 2
  {{- if not .Values.gatewaybridge.autoscaling.enabled }}
  replicas: {{ .Values.gatewaybridge.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gatewaybridge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-bridge-configmap.yaml") . | sha256sum }}
        checksum/toml: {{ include (print $.Template.BasePath "/gateway-bridge-toml-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/gateway-bridge-secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gatewaybridge.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chirpstack.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.gatewaybridge.image.repository }}:{{ .Values.gatewaybridge.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gatewaybridge.image.pullPolicy }}
          {{- with .Values.gatewaybridge.args }}                                                                                   
          args:                                                                                                                 
          {{- toYaml . | nindent 12 }}                                                                                        
          {{- end }}  
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.gatewaybridge.service.containerPort }}
              protocol: UDP
          # envFrom maps all keys from the ConfigMap and Secret
          envFrom:
            {{- if .Values.gatewaybridge.enabled.configMap }}
            - configMapRef:
                name: {{ include "gatewaybridge.fullname" . }}-config
            {{- end }}
            {{- if .Values.gatewaybridge.enabled.secret }}
            - secretRef:
                name: {{ .Values.gatewaybridge.secret.name }}
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/chirpstack-gateway-bridge
            {{- with .Values.secretMounts }}
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .path }}
              readOnly: true
            {{- end }}
            {{- end }}            
          # livenessProbe:
          #   tcpSocket:
          #     port: http
          #   initialDelaySeconds: 30
          #   periodSeconds: 30
          # readinessProbe:
          #   tcpSocket:
          #     port: http
          #   initialDelaySeconds: 10
          #   periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-volume
          projected:
            sources:
            - configMap:
                name: {{ include "gatewaybridge.fullname" . }}-config
            - configMap:
                name: {{ include "chirpstack.fullname" . }}-gateway-bridge-toml-config
        - name: chirpstack-certs
          secret:
            secretName: {{ include "chirpstack.fullname" . }}-certs
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
