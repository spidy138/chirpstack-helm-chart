nameOverride: ""
fullnameOverride: "chirpstack"
namespace: "chirpstack"
createNamespace: false

gatewaybridgebasicstation:
  replicaCount: 1
  command: []
  args:
    - -c
    - /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-in865.toml
  image:
    repository: chirpstack/chirpstack-gateway-bridge
    pullPolicy: IfNotPresent
    tag: "4"
  enabled:
    deployment: true
    configMap: true
    secret: true
  configMapData:
    MQTT_BROKER_HOST: vernemq.vernemq
    MQTT_BROKER_PORT: 8883
    REDIS_HOST: "redis.chirpstack"
    REDIS_PORT: 6379
    CA_CERT_PATH: /etc/ssl/vernemq/ca.crt
    TLS_CERT_PATH: /etc/ssl/vernemq/cert.crt
    TLS_KEY_PATH: /etc/ssl/vernemq/key.key
  secret:
    name: gateway-bridge-basicstation-secret
    values:
      REDIS_PASSWORD: "password"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001
    containerPort: 3001

gatewaybridge:
  replicaCount: 1
  command: []
  args:
    - -c
    - /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml
  image:
    repository: chirpstack/chirpstack-gateway-bridge
    pullPolicy: IfNotPresent
    tag: "4"
  enabled:
    deployment: true
    configMap: true
    secret: true
  configMapData:
    MQTT_BROKER_HOST: vernemq.vernemq
    INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: in865/gateway/{{ .GatewayID }}/event/{{ .EventType }}
    INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: in865/gateway/{{ .GatewayID }}/state/{{ .StateType }}
    INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: in865/gateway/{{ .GatewayID }}/command/#
    REDIS_HOST: "redis.chirpstack"
    REDIS_PORT: 6379
    CA_CERT_PATH: /etc/ssl/vernemq/ca.crt
    TLS_CERT_PATH: /etc/ssl/vernemq/cert.crt
    TLS_KEY_PATH: /etc/ssl/vernemq/key.key
    MQTT_BROKER_PORT: 8883
  secret:
    name: gateway-bridge-secret
    values:
      REDIS_PASSWORD: "password"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 1700
    targetPort: 1700
    containerPort: 1700

chirpstack:
  replicaCount: 1
  command: []
  args:
    - -c
    - /etc/chirpstack
  image:
    repository: chirpstack/chirpstack
    pullPolicy: IfNotPresent
    tag: "4"
  enabled:
    deployment: true
    configMap: true
    secret: true
  configMapData:
    REDIS_DATABASE: 0
    REDIS_tlsEnabled: false
    REDIS_keyPrefix: "chirpstack"
    REDIS_PASSWORD: "password"
    POSTGRESQL_HOST: "postgres.chirpstack"
    POSTGRESQL_PORT: "5432"
    POSTGRESQL_USER: "chirpstack"
    POSTGRESQL_PASSWORD: "chirpstack"
    POSTGRESQL_DB: "chirpstack"
    API_SECRET: "secret"
    MQTT_BROKER_HOST: vernemq.vernemq
    MQTT_BROKER_PORT: 8883
    REDIS_HOST: "redis.chirpstack"
    REDIS_PORT: 6379
    CA_CERT_PATH: /etc/ssl/vernemq/ca.crt
    TLS_CERT_PATH: /etc/ssl/vernemq/cert.crt
    TLS_KEY_PATH: /etc/ssl/vernemq/key.key      

  # Redis configuration
  redis:
    host: "redis.chirpstack"
    port: 6379
    password: "password"

  # PostgreSQL configuration
  postgresql:
    host: "postgres.chirpstack"
    port: 5432
    username: "chirpstack"
    password: "chirpstack"
    database: "chirpstack"

  secret:
    name: chirpstack-secret
    values:
      REDIS_HOST: "redis.chirpstack"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "password"
      POSTGRESQL_HOST: "postgres.chirpstack"
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USER: "chirpstack"
      POSTGRESQL_PASSWORD: "chirpstack"
      POSTGRES_PASSWORD: "chirpstack"
      POSTGRESQL_DB: "chirpstack"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    containerPort: 8080

restapi:
  replicaCount: 1
  args:
    - --server
    - chirpstack:8080
    - --bind
    - 0.0.0.0:8090
    - --insecure
  image:
    repository: chirpstack/chirpstack-rest-api
    pullPolicy: IfNotPresent
    tag: "4"
  enabled:
    deployment: true
    configMap: false
    secret: false
  configMapData:
    REDIS_DATABASE: 0
    REDIS_tlsEnabled: false
    REDIS_keyPrefix: "chirpstack"
    REDIS_HOST: "redis.chirpstack"
    REDIS_PORT: "6379"
    REDIS_PASSWORD: "password"
    POSTGRESQL_HOST: "postgres.chirpstack"
    POSTGRESQL_PORT: "5432"
    POSTGRES_USER: "chirpstack" 
    POSTGRESQL_PASSWORD: "chirpstack"
    POSTGRESQL_DB: "chirpstack"
    API_SECRET: "secret"
    MQTT_BROKER_HOST: "vernemq.vernemq"
  secret:
    name: restapi-secret
    values:
      REDIS_PASSWORD: "password"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
    containerPort: 8090
